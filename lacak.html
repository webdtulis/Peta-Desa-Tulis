<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lacak Laporan - Desa Tulis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    
    .header { background: #1e293b; width: 100%; padding: 20px; text-align: center; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .header p { margin: 5px 0 0 0; font-size: 13px; color: #cbd5e1; }
    
    .container { width: 100%; max-width: 500px; padding: 20px; margin-top: 20px; }
    
    .search-box { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; text-align: center; }
    .search-box h3 { margin-top: 0; font-size: 16px; color: #0f172a; margin-bottom: 15px; }
    .input-grup { display: flex; gap: 10px; margin-bottom: 10px; }
    
    /* Input diubah agar bisa menerima teks (Email) dan angka (HP) */
    .input-grup input { flex: 1; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; font-family: 'Inter'; }
    .input-grup input:focus { border-color: #3b82f6; }
    
    .btn-cari { background: #3b82f6; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .btn-cari:hover { background: #2563eb; }
    
    #loading { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; font-weight: 500; display: none; }
    
    #hasil-container { margin-top: 24px; display: none; }
    .card-laporan { background: white; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 15px; position: relative; overflow: hidden; }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 10px; }
    .tanggal { font-size: 12px; color: #64748b; font-weight: 500; }
    .kategori { font-size: 11px; background: #f1f5f9; color: #475569; padding: 4px 8px; border-radius: 4px; font-weight: 600; border: 1px solid #e2e8f0; }
    
    .masalah { font-size: 14px; color: #1e293b; line-height: 1.5; margin-bottom: 15px; font-weight: 500; }
    
    .status-badge { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; text-align: center; }
    
    .badge-belum { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .badge-proses { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .badge-selesai { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .badge-batal { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    
    .empty-state { text-align: center; padding: 30px 20px; background: white; border-radius: 12px; border: 1px dashed #cbd5e1; color: #64748b; font-size: 14px; margin-top: 20px; }
    .btn-kembali { display: inline-block; margin-top: 30px; color: #3b82f6; text-decoration: none; font-size: 14px; font-weight: 600; }
    .btn-kembali:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Portal Lacak Pengaduan</h1>
    <p>Pemerintah Desa Tulis</p>
  </div>

  <div class="container">
    <div class="search-box">
      <h3>Cek Status Laporan Anda</h3>
      <div class="input-grup">
        <!-- Tipe diubah menjadi "text" agar warga bisa mengetik Email (huruf) atau HP (angka) -->
        <input type="text" id="input-pencarian" placeholder="Contoh: 0812... atau nama@email.com" autocomplete="off">
        <button class="btn-cari" onclick="cariLaporan()">Cari</button>
      </div>
      <!-- Instruksi diperbarui -->
      <p style="font-size: 11px; color: #94a3b8; margin: 0; line-height: 1.4;">
        Masukkan <strong>Nomor HP/WhatsApp</strong> atau <strong>Alamat Email</strong> yang Anda gunakan saat mengisi formulir pengaduan.
      </p>
    </div>

    <div id="loading">⏳ Sedang mencari data laporan Anda...</div>
    
    <div id="hasil-container"></div>
    
    <div style="text-align: center;">
      <a href="index.html" class="btn-kembali">Kembali ke Peta WebGIS</a>
    </div>
  </div>

  <script>
    // ========================================================
    // MASUKKAN URL API (SAMA SEPERTI YANG DI ADMIN.HTML)
    // ========================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbyKfpvbWAKpus_5mU78uDktC2PoLL2ODsF0KZ-R3K40rfmW2r3QkUa20QhKKIPDW6PLNQ/exec"; 

    async function cariLaporan() {
      // Mengambil input warga dan merubahnya menjadi huruf kecil semua (agar email tidak sensitif huruf besar/kecil)
      const inputVal = document.getElementById("input-pencarian").value.trim().toLowerCase();
      
      // Syarat pencarian minimal 5 karakter (Karena email seperti a@b.co butuh minimal karakter)
      if (!inputVal || inputVal.length < 5) {
        alert("Mohon masukkan Nomor HP atau Alamat Email yang valid.");
        return;
      }

      document.getElementById("loading").style.display = "block";
      document.getElementById("hasil-container").style.display = "none";
      const wadahHasil = document.getElementById("hasil-container");
      wadahHasil.innerHTML = "";

      try {
        const response = await fetch(API_URL);
        const semuaData = await response.json();
        
        document.getElementById("loading").style.display = "none";
        
        if (semuaData.length > 0 && semuaData[0].error) {
          wadahHasil.innerHTML = `<div class="empty-state" style="color:red;">❌ Terjadi kesalahan server. Mohon coba lagi nanti.</div>`;
          wadahHasil.style.display = "block";
          return;
        }

        // ========================================================
        // LOGIKA PENCARIAN CERDAS (HP ATAU EMAIL)
        // ========================================================
        const laporanWarga = semuaData.filter(lap => {
          // 1. Cek apakah cocok dengan Nomor HP
          const cocokHP = lap.hp && String(lap.hp).includes(inputVal);
          // 2. Cek apakah cocok dengan Email
          const cocokEmail = lap.email && String(lap.email).toLowerCase().includes(inputVal);
          
          // Jika salah satu cocok (True), maka tampilkan datanya
          return cocokHP || cocokEmail;
        });

        if (laporanWarga.length === 0) {
          wadahHasil.innerHTML = `
            <div class="empty-state">
              <div style="font-size: 24px; margin-bottom: 10px;">🕵️‍♂️</div>
              Data tidak ditemukan.<br>Pastikan <strong>Nomor HP</strong> atau <strong>Email</strong> yang dimasukkan persis sama dengan saat Anda melapor.
            </div>`;
          wadahHasil.style.display = "block";
          return;
        }

        let htmlHasil = `<h3 style="font-size:15px; color:#334155; margin-bottom:15px;">Ditemukan ${laporanWarga.length} Laporan Anda:</h3>`;
        
        laporanWarga.forEach(lap => {
          let kelasBadge = "badge-batal";
          let icon = "⚫";
          
          if (lap.status === "Belum Ditangani") { kelasBadge = "badge-belum"; icon = "🔴"; }
          else if (lap.status === "Sedang Diproses") { kelasBadge = "badge-proses"; icon = "🟡"; }
          else if (lap.status === "Sudah Ditangani") { kelasBadge = "badge-selesai"; icon = "🟢"; }

          htmlHasil += `
            <div class="card-laporan">
              <div class="card-header">
                <span class="tanggal">📅 Dilaporkan: ${lap.waktuLapor.split(' ')[0]}</span>
                <span class="kategori">${lap.kategori}</span>
              </div>
              
              <div class="masalah">
                "${lap.masalah}"
              </div>
              
              <div class="status-badge ${kelasBadge}">
                ${icon} Status: ${lap.status}
              </div>
            </div>
          `;
        });

        wadahHasil.innerHTML = htmlHasil;
        wadahHasil.style.display = "block";

      } catch (err) {
        document.getElementById("loading").style.display = "none";
        wadahHasil.innerHTML = `<div class="empty-state" style="color:red;">❌ Gagal terhubung ke server. Periksa koneksi internet Anda.</div>`;
        wadahHasil.style.display = "block";
      }
    }

    // Fitur tekan Enter untuk mencari (ID diperbarui agar sesuai dengan input baru)
    document.getElementById("input-pencarian").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        cariLaporan();
      }
    });
  </script>
</body>
</html>
